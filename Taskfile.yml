# `build`/`check`/`package`/`lint` run directly on the host — meaningful only on
# a Linux aarch64 box with Rust installed (CI, already such a runner). The
# `docker:*` variants wrap the same logic in Docker for local dev, since the
# webOS cross-toolchain only ships a Linux aarch64 build.
# webOS-specific plumbing lives in `taskfiles/toolchain.yml`, kept separate so
# this file stays short.
version: '3'

# Suppress go-task's echo of each command before it runs — keeps task output
# to just the command's own output (less noise, fewer tokens when read back).
silent: true

# TV_HOST (used by deploy below) can live in a local, gitignored .env
# instead of being typed on every invocation — see .env.example.
dotenv: ['.env']

env:
  # Modern CMake refuses vendored libopus's old cmake_minimum_required
  # (audiopus_sys, pulled in transitively by punktfunk-core's `quic` feature).
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

includes:
  toolchain:
    taskfile: ./taskfiles/toolchain.yml
    vars:
      NDK_DIR: '{{.NDK_DIR}}'
      SYSROOT: '{{.SYSROOT}}'
      TARGET: '{{.TARGET}}'
      APP_ID: '{{.APP_ID}}'
      RUST_IMAGE: '{{.RUST_IMAGE}}'

vars:
  APP_ID: io.dyptan.punktfunk.webos
  TV_DEVICE: webos-tv
  SSH_KEY: '{{.SSH_KEY | default "$HOME/.ssh/id_rsa"}}'
  RELEASE_LTO: '{{.RELEASE_LTO | default "thin"}}'
  NDK_DIR: .toolchains/arm-webos-linux-gnueabi_sdk-buildroot
  SYSROOT: '{{.NDK_DIR}}/arm-webos-linux-gnueabi/sysroot'
  TARGET: armv7-unknown-linux-gnueabi
  RUST_IMAGE: rust:bookworm
  PKG_VERSION:
    sh: |
      if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
        echo "${GITHUB_REF_NAME#v}"
      else
        LATEST=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 0.0.1)
        SHA=$(git rev-parse --short=8 HEAD 2>/dev/null || echo unknown)
        echo "${LATEST}+git.${SHA}"
      fi

tasks:
  build:
    desc: >-
      Cross-compile the release binary directly on the host, no Docker — only
      meaningful on a Linux aarch64 box with Rust already installed (used by CI;
      `docker:build` is the local dev entry point). Thin LTO (fast); override
      with RELEASE_LTO=fat for an optimized build.
    deps: [toolchain:all]
    env:
      # Thread the packaged version into the binary so the UI's build marker matches
      # the .ipk (Cargo.toml stays a fixed 0.0.1; recomputed inside Docker from the
      # mounted repo's git, so both `build` and CI's `build` pick it up).
      PKG_VERSION: '{{.PKG_VERSION}}'
    cmds:
      - rustup target add {{.TARGET}}
      - cargo build --release --target {{.TARGET}}

  check:
    desc: Quick cross-target `cargo check`, no Docker (used by CI)
    deps: [toolchain:all]
    cmds:
      - rustup target add {{.TARGET}}
      - cargo check --target {{.TARGET}}

  lint:
    desc: Cross-target `cargo clippy` (the lint set in Cargo.toml's `[lints.clippy]`), no Docker (used by CI)
    deps: [toolchain:all]
    cmds:
      - rustup target add {{.TARGET}}
      - rustup component add clippy
      - cargo clippy --target {{.TARGET}} --all-targets -- -D warnings

  package:
    desc: >-
      Build and package dist/*.ipk, no Docker (used by CI). Thin LTO (fast); override with
      RELEASE_LTO=fat for optimized. PROBES=1 also ships `pfprobe`/`gsprobe` for on-device
      diagnostics over SSH.
    deps: [build, toolchain:ares-package]
    cmds:
      - task: toolchain:stage-and-package
        vars:
          PKG_VERSION: '{{.PKG_VERSION}}'
          PROBES: '{{.PROBES}}'

  fmt:
    desc: Format the whole crate with rustfmt (native — formatting doesn't need the cross toolchain)
    cmds:
      - cargo fmt

  docker:build:
    desc: Cross-compile the release binary inside Docker with thin LTO (fast) — the local dev entry point. Override with RELEASE_LTO=fat for optimized build.
    cmds:
      - task: toolchain:docker-run
        vars:
          TARGET_TASK: build
          RELEASE_LTO: '{{.RELEASE_LTO}}'

  docker:check:
    desc: Quick cross-target `cargo check`, inside Docker — the local dev entry point
    cmds:
      - task: toolchain:docker-run
        vars: {TARGET_TASK: check}

  docker:lint:
    desc: Cross-target `cargo clippy` (the lint set in Cargo.toml's `[lints.clippy]`), inside Docker
    cmds:
      - task: toolchain:docker-run
        vars: {TARGET_TASK: lint}

  docker:package:
    desc: Build and package dist/*.ipk, inside Docker with thin LTO (fast) — the local dev entry point. Override with RELEASE_LTO=fat for optimized.
    cmds:
      - task: toolchain:docker-run
        vars:
          TARGET_TASK: package
          PROBES: '{{.PROBES}}'
          RELEASE_LTO: '{{.RELEASE_LTO}}'

  register-device:
    internal: true
    deps: [toolchain:ares-device]
    requires:
      vars: [TV_HOST]
    vars:
      TV_IP: '{{splitList "@" .TV_HOST | last}}'
      TV_USER: '{{if contains "@" .TV_HOST}}{{splitList "@" .TV_HOST | first}}{{else}}root{{end}}'
    status:
      - ares-setup-device -l | grep -qE '^{{.TV_DEVICE}}( \(default\))? +{{.TV_USER}}@{{.TV_IP}}:22 '
      - 'ares-setup-device -F | grep -qF "openSshPath : {{.SSH_KEY}}"'
    cmds:
      - ares-setup-device -r {{.TV_DEVICE}} >/dev/null 2>&1 || true
      - >-
        ares-setup-device -a {{.TV_DEVICE}} -i host={{.TV_IP}}
        -i port=22 -i username={{.TV_USER}} -i keyPath="{{.SSH_KEY}}" -i default=true >/dev/null

  deploy:
    desc: >-
      Build, package, install, and launch on a real TV via ares-cli-rs only.
      Usage: task deploy TV_HOST=root@<tv-ip> (or set TV_HOST in .env).
      TELEMETRY=<host:port> streams logs; TELEMETRY=auto uses this machine's LAN IP
      and a random port. TELEMETRY_LEVEL (debug/info/warn/error, default debug)
      sets the minimum streamed level.
    deps: [docker:package, register-device]
    vars:
      IPK: dist/{{.APP_ID}}_{{.PKG_VERSION}}_arm.ipk
      TELEMETRY_LEVEL: '{{.TELEMETRY_LEVEL | default "debug"}}'
    cmds:
      - test -f "{{.IPK}}" || { echo "no {{.IPK}} — packaging failed?" >&2; exit 1; }
      - ares-install -d {{.TV_DEVICE}} "{{.IPK}}"
      - |
        set -eu
        TELEMETRY="{{.TELEMETRY}}"
        if [ "$TELEMETRY" = "auto" ]; then
          IP="$(ipconfig getifaddr en0 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}')"
          PORT="$(awk 'BEGIN { srand(); print int(20000 + rand() * 20000) }')"
          TELEMETRY="${IP}:${PORT}"
        fi

        NC_PID=""
        set -- {{.APP_ID}}
        if [ -n "$TELEMETRY" ]; then
          PORT="${TELEMETRY##*:}"
          ( while true; do nc -l "$PORT"; done ) &
          NC_PID=$!
          trap 'kill "$NC_PID" 2>/dev/null || true' EXIT
          echo "listening on :${PORT} (destination sent to device: $TELEMETRY)" >&2
          set -- "$@" -p "telemetry=$TELEMETRY" -p "telemetry_level={{.TELEMETRY_LEVEL}}"
        fi
        ares-launch -d {{.TV_DEVICE}} "$@"
        if [ -n "$NC_PID" ]; then
          wait "$NC_PID"
        fi

  clean:
    desc: Remove everything — dist/, .toolchains/, target/, and the Docker volumes
    cmds:
      - rm -rf ./dist ./.toolchains ./target
      - docker volume ls -q --filter name=punktfunk-webos- | xargs docker volume rm -f
