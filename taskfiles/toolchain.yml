version: '3'

# Match the root Taskfile: suppress go-task's per-command echo.
silent: true

vars:
  SDL2_BACKPORT_RELEASE: release-2.30.12-webos.5
  SDL2_BACKPORT_VERSION: 2.30.12
  SDL2_BACKPORT_SONAME: libSDL2-2.0.so.0.3000.12
  RELEASE_LTO: 'thin'
  DOCKER_MOUNTS: >-
    -v {{.ROOT_DIR}}:/workspace
    -v punktfunk-webos-toolchains:/workspace/.toolchains
    -v punktfunk-webos-target:/workspace/target
    -v punktfunk-webos-cargo:/opt/punktfunk-webos-cargo
    -v punktfunk-webos-apt-cache:/var/cache/apt/archives
    -v punktfunk-webos-apt-lists:/var/lib/apt/lists
    -v punktfunk-webos-tools:/opt/punktfunk-webos-tools
    -w /workspace
    -e CARGO_HOME=/opt/punktfunk-webos-cargo
    -e PATH=/opt/punktfunk-webos-tools/bin:/opt/punktfunk-webos-cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

tasks:
  ndk:
    desc: Fetch the webosbrew/native-toolchain cross-compiler
    status:
      - test -x {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-gcc
    cmds:
      - |
        set -eu
        case "$(uname -s)-$(uname -m)" in
            Linux-aarch64|Linux-arm64) PLATFORM=linux-aarch64 ;;
            *)
                echo "no webosbrew/native-toolchain release for $(uname -s)-$(uname -m) — must run on Linux/aarch64" >&2
                exit 1
                ;;
        esac
        ASSET="arm-webos-linux-gnueabi_sdk-buildroot_${PLATFORM}.tar.bz2"
        URL="https://github.com/webosbrew/native-toolchain/releases/latest/download/${ASSET}"
        mkdir -p "$(dirname {{.NDK_DIR}})"
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        curl -sL -o "$TMP/$ASSET" "$URL"
        tar xjf "$TMP/$ASSET" -C "$(dirname {{.NDK_DIR}})"
        sh {{.NDK_DIR}}/relocate-sdk.sh
        echo 'int main(void) { return 0; }' | {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-gcc \
            --sysroot={{.SYSROOT}} -x c -o "$TMP/probe" -

  sdl2:
    desc: Overlay webosbrew/SDL-webOS onto the NDK sysroot
    deps: [ndk]
    status:
      - test "$(readlink {{.SYSROOT}}/usr/lib/libSDL2-2.0.so.0)" = "{{.SDL2_BACKPORT_SONAME}}"
    cmds:
      - |
        set -eu
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        ASSET="SDL2-{{.SDL2_BACKPORT_VERSION}}-webos.tar.gz"
        URL="https://github.com/webosbrew/SDL-webOS/releases/download/{{.SDL2_BACKPORT_RELEASE}}/${ASSET}"
        curl -sL -o "$TMP/$ASSET" "$URL"
        mkdir -p "$TMP/extracted"
        tar xzf "$TMP/$ASSET" -C "$TMP/extracted"
        cp -RL "$TMP/extracted/include/SDL2/." {{.SYSROOT}}/usr/include/SDL2/
        cp -L "$TMP/extracted/lib/{{.SDL2_BACKPORT_SONAME}}" {{.SYSROOT}}/usr/lib/{{.SDL2_BACKPORT_SONAME}}
        ln -sf {{.SDL2_BACKPORT_SONAME}} {{.SYSROOT}}/usr/lib/libSDL2-2.0.so.0
        ln -sf {{.SDL2_BACKPORT_SONAME}} {{.SYSROOT}}/usr/lib/libSDL2.so
        sed -i.bak "s/^Version:.*/Version: {{.SDL2_BACKPORT_VERSION}}/" {{.SYSROOT}}/usr/lib/pkgconfig/sdl2.pc
        rm -f {{.SYSROOT}}/usr/lib/pkgconfig/sdl2.pc.bak

  all:
    desc: Fetch the full webOS cross-toolchain
    deps: [sdl2]

  ares-package:
    desc: Install ares-package (webosbrew/ares-cli-rs) if it isn't already on PATH
    status:
      - command -v ares-package
    cmds:
      - cargo install --locked --git https://github.com/webosbrew/ares-cli-rs ares-package

  ares-device:
    # Kept separate from ares-package: these link libssh/OpenSSL/GTK and take
    # minutes to build, and only `deploy` needs them — CI packages without them.
    desc: >-
      Install the ares-cli-rs device tools (setup-device/install/launch) that
      deploy uses instead of raw ssh/scp, if they aren't already on PATH
    status:
      - command -v ares-setup-device
      - command -v ares-install
      - command -v ares-launch
    cmds:
      - >-
        cargo install --locked --git https://github.com/webosbrew/ares-cli-rs
        ares-setup-device ares-install ares-launch

  stage-and-package:
    internal: true
    requires:
      vars: [PKG_VERSION, APP_ID, TARGET, NDK_DIR, SYSROOT]
    cmds:
      - |
        set -eu
        APP_ID={{.APP_ID}}
        STAGE_DIR="$(mktemp -d)"
        trap 'rm -rf "$STAGE_DIR"' EXIT
        mkdir -p "$STAGE_DIR/bin" "$STAGE_DIR/lib"
        cp target/{{.TARGET}}/release/punktfunk-webos "$STAGE_DIR/bin/"
        cp -L {{.SYSROOT}}/usr/lib/libSDL2-2.0.so.0 "$STAGE_DIR/lib/libSDL2-2.0.so.0"
        {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-strip \
          "$STAGE_DIR/bin/punktfunk-webos" "$STAGE_DIR/lib/libSDL2-2.0.so.0"
        # PROBES=1 ships the headless diagnostic CLIs (`pfprobe`, `gsprobe`) alongside the app,
        # for running over SSH against a host. Off by default: they are half a megabyte the store
        # package has no use for, and nothing in the app launches them.
        if [ -n "{{.PROBES}}" ]; then
          for probe in pfprobe gsprobe; do
            cp "target/{{.TARGET}}/release/$probe" "$STAGE_DIR/bin/"
            {{.NDK_DIR}}/bin/arm-webos-linux-gnueabi-strip "$STAGE_DIR/bin/$probe"
          done
        fi
        cp packaging/appinfo.json packaging/icon.png packaging/icon_large.png packaging/splash.png "$STAGE_DIR/"

        PKG_VERSION="{{.PKG_VERSION}}"
        APP_VERSION="${PKG_VERSION%%+git.*}"
        case "$APP_VERSION" in
          *+*|*[^0-9.]*) echo "error: APP_VERSION '${APP_VERSION}' is not x.x.x" >&2; exit 1 ;;
        esac
        sed -i.bak "s/\"version\": \"0.0.1\"/\"version\": \"${APP_VERSION}\"/" "$STAGE_DIR/appinfo.json"
        rm -f "$STAGE_DIR/appinfo.json.bak"
        mkdir -p dist
        ares-package "$STAGE_DIR" -o dist --force-arch arm

        # Homebrew manifest is generated in CI by webosbrew-toolbox-gen-manifest
        # (.github/workflows/webosbrew.yml), not here.
        if [ "$PKG_VERSION" != "$APP_VERSION" ]; then
          mv "dist/${APP_ID}_${APP_VERSION}_arm.ipk" "dist/${APP_ID}_${PKG_VERSION}_arm.ipk"
        fi

  docker-run:
    internal: true
    requires:
      vars: [TARGET_TASK]
    vars:
      CODEGEN_UNITS: '{{if eq .RELEASE_LTO "fat"}}1{{else}}16{{end}}'
    cmds:
      - >-
        docker run --rm --platform linux/arm64 -e DEBIAN_FRONTEND=noninteractive
        -e CARGO_PROFILE_RELEASE_LTO={{.RELEASE_LTO}}
        -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS={{.CODEGEN_UNITS}}
        {{.DOCKER_MOUNTS}} {{.RUST_IMAGE}}
        sh -c '
          apt-get update -qq &&
          apt-get install -y -qq --no-install-recommends apt-utils cmake curl ca-certificates git pkg-config build-essential xz-utils python3 > /dev/null &&
          if ! command -v task > /dev/null 2>&1; then
            curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b /opt/punktfunk-webos-tools/bin > /dev/null;
          fi &&
          task {{.TARGET_TASK}} PROBES={{.PROBES}}
        '

