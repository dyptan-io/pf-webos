[package]
name = "punktfunk-webos"
description = "Native LG webOS TV client for punktfunk — session pump direct on punktfunk-core, NDL DirectMedia hardware video decode, SDL2 window/gamepad/remote input."
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["Volodymyr Dyptan <volodymyr@dyptan.dev>"]
repository = "https://github.com/dyptan-io/punktfunk-webos"

[[bin]]
name = "punktfunk-webos"
path = "src/main.rs"

[lints.clippy]
cast_lossless = "warn"
map_unwrap_or = "warn"
use_self = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
format_collect = "warn"
suspicious_operation_groupings = "warn"

[dependencies]
anyhow = "1"
# Enables punktfunk-core's internal tracing (ABR, RFI recovery); without this subscriber,
# core's tracing calls are dropped (see main.rs).
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# v0.22.3 is the first release carrying core's `PUNKTFUNK_ABR_PROBE_KBPS` cap, which `main.rs`
# sets — before it, the startup probe bursts at a fixed 2 Gbps (see docs/NOTES.md).
punktfunk-core = { git = "https://git.unom.io/unom/punktfunk", tag = "v0.22.3", features = ["quic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# mDNS LAN discovery; direct dep (not via pf-client-core — see session.rs docs).
mdns-sd = "0.20"

# Linux-only (webOS cross target + dev boxes); macOS/Windows build with stub in main.rs.
[target.'cfg(target_os = "linux")'.dependencies]
# ttf: SDL2_ttf + freetype on-device; text renders in Geist font. unsafe_textures
# lets GPU compositor cache textures without TextureCreator lifetime.
sdl2 = { version = "0.38", default-features = false, features = ["ttf", "unsafe_textures"] }
# Opus decode (audio.rs); explicit dep despite being transitive via punktfunk-core.
opus = "0.3"
# mTLS game library fetch (library.rs) + cover art decode (art.rs); pure Rust codecs.
ureq = { version = "3", features = ["rustls"], default-features = false }
rustls = { version = "0.23", features = ["ring"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Pre-stream UI rendering (software rasterizer); png-format off (already-decoded buffers only).
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
# setpriority for video pump scheduling; explicit dep for libc::gettid calls.
libc = "0.2"

[build-dependencies]
serde_json = "1"

[profile.release]
# Hot loops (AEAD decrypt, FEC, QUIC parsing) live in punktfunk-core deps.
# Fat LTO + codegen-units=1 enables cross-crate inlining for crypto hotpaths;
# use lto="thin" for faster dev iteration.
lto = "fat"
codegen-units = 1
