name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  cross-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Install Rust (stable, prebuilt) + cross target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabi

      - name: Cache cargo registry/git/target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.repository }}-armv7-unknown-linux-gnueabi
          workspaces: |
            . -> target
            . -> target-clippy

      - name: Cache webOS toolchain + ares-package
        uses: actions/cache@v5
        with:
          path: |
            .toolchains
            ~/.cargo/bin/ares-package
          key: webos-toolchain-${{ runner.os }}-${{ hashFiles('taskfiles/toolchain.yml') }}

      - name: Install task
        uses: arduino/setup-task@v3
        with:
          version: 3

      - name: Lint
        run: task lint
        env:
          CARGO_TARGET_DIR: target-clippy

      - name: Build and package
        run: task package

      - name: Upload .ipk artifact
        uses: actions/upload-artifact@v7
        with:
          name: io.dyptan.punktfunk.webos
          path: dist/*.ipk

  webosbrew:
    needs: cross-build
    permissions:
      contents: write
    uses: ./.github/workflows/webosbrew.yml
    with:
      artifact: io.dyptan.punktfunk.webos
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
